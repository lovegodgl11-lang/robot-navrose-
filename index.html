            --text-secondary: #6b7280;

            font-family: 'Inter', sans-serif;

        .form-input, .form-select, .form-textarea {

        #voice-assistant-ui {
            transition: all 0.3s ease-in-out;

        #mic-btn.listening {

        @keyframes pulse {

    <script>
        const firebaseConfig = {

        let db;

        // Voice Assistant State
        let recognition;

        // DOM Elements

        function showToast(message, ms = 3000) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.classList.add('show');
            clearTimeout(t.hideTimeout);
            t.hideTimeout = setTimeout(() => t.classList.remove('show'), ms);
        }

        function speak(text, onEndCallback = () => {}) {
            if (!('speechSynthesis' in window)) {
                console.warn("Speech synthesis not supported.");
                onEndCallback();
                return;
            }
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-IN';
            utterance.rate = 0.9;
            utterance.onend = onEndCallback;
            assistantStatusEl.textContent = text;
            speechSynthesis.speak(utterance);
        }
        
        function highlightField(elementId) {
            document.querySelectorAll('.highlight-field').forEach(el => el.classList.remove('highlight-field'));
            if (elementId) {
                const el = document.getElementById(elementId);
                if (el) {
                    el.classList.add('highlight-field');
                    el.focus();
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }
        
        function getNextOrderNumber() {
            const prefix = 'AUTO';
            const relevantOrders = allOrders.filter(o => o.orderNumber && o.orderNumber.startsWith(prefix + '-'));
            const lastNumber = relevantOrders.reduce((max, o) => {
                const num = parseInt(o.orderNumber.split('-')[1], 10);
                return Math.max(max, isNaN(num) ? 0 : num);
            }, 0);
            return `${prefix}-${String(lastNumber + 1).padStart(3, '0')}`;
        }
        
        function initializeFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                db.ref('orders').on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    allOrders = Object.values(data);
                });
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                showToast("Connection to database failed.", 5000);
            }
        }
        
        function resetForm() {
            orderForm.reset();
            document.getElementById('items-container').innerHTML = '';
            document.getElementById('total-charges').textContent = '₹0.00';
            document.getElementById('editing-order-id').value = '';
            itemCounter = 0;
            conversationState = 'IDLE';
            stateContext = {};
            lastSearchResults = [];
            totalItemsToAdd = 0;
            currentItemIndex = 0;
            highlightField(null);
        }
        
        function showForm() {
            orderForm.classList.remove('hidden');
        }

        function hideForm() {
            orderForm.classList.add('hidden');
            searchResultsContainer.innerHTML = '';
            resetForm();
        }

        function setupVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                micBtn.disabled = true;
                micNotSupportedMessage.classList.remove('hidden');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-IN';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'no-speech') {
                    assistantStatusEl.textContent = "Didn't hear anything. Please try again.";
                } else {
                    assistantStatusEl.textContent = "Voice recognition error.";
                }
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                transcriptEl.textContent = `You said: "${transcript}"`;
                processVoiceCommand(transcript);
            };

            micBtn.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                } else {
                    try { recognition.start(); } catch(e) { console.error("Could not start recognition", e); }
                }
            });
        }
        
        // ... (keep existing parseSpokenNumber and parseSpokenDate functions)
        function parseSpokenNumber(text) {
            const cleanedText = text.toLowerCase().replace(/[.।,-]/g, '').trim();

            const directNumberMatch = cleanedText.match(/\d+/);
            if (directNumberMatch) {
                const num = parseInt(directNumberMatch[0], 10);
                if (!isNaN(num)) {
                    return num;
                }
            }

            const wordMap = {
                'zero': 0, 'shunya': 0,
                'one': 1, 'ek': 1,
                'two': 2, 'do': 2, 'to': 2, 'too': 2,
                'three': 3, 'teen': 3,
                'four': 4, 'char': 4, 'for': 4,
                'five': 5, 'panch': 5,
                'six': 6, 'chhah': 6,
                'seven': 7, 'saat': 7,
                'eight': 8, 'aath': 8,
                'nine': 9, 'nau': 9,
                'ten': 10, 'das': 10,
                'twenty': 20, 'bees': 20,
                'thirty': 30, 'tees': 30,
                'forty': 40, 'chalees': 40,
                'fifty': 50, 'pachaas': 50,
                'sixty': 60, 'saath': 60,
                'seventy': 70, 'sattar': 70,
                'eighty': 80, 'assi': 80,
                'ninety': 90, 'nabbe': 90,
                'hundred': 100, 'sau': 100,
            };

            for (const word in wordMap) {
                if (cleanedText.includes(word)) {
                    return wordMap[word];
                }
            }

            return NaN;
        }
        
        function parseSpokenDate(text) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const lowerText = text.toLowerCase().replace(/[^a-z0-9]/gi, '');

            if (/^\d{8}$/.test(lowerText)) {
                const day = lowerText.substring(0, 2);
                const month = lowerText.substring(2, 4);
                const year = lowerText.substring(4, 8);
                const parsedDate = new Date(year, month - 1, day);
                if (!isNaN(parsedDate.getTime())) {
                    return parsedDate;
                }
            }
            if (lowerText.includes('aaj') || lowerText.includes('today')) return today;
            if (lowerText.includes('kal') || lowerText.includes('tomorrow')) {
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);
                return tomorrow;
            }
            if (lowerText.includes('parso') || lowerText.includes('parson')) {
                const dayAfter = new Date(today);
                dayAfter.setDate(today.getDate() + 2);
                return dayAfter;
            }
            const dateMatch = lowerText.match(/(\d{1,2})/);
            if (dateMatch) {
                const day = parseInt(dateMatch[1], 10);
                if (day > 0 && day <= 31) {
                    const date = new Date();
                    date.setHours(0, 0, 0, 0);
                    if (day < today.getDate()) date.setMonth(today.getMonth() + 1);
                    date.setDate(day);
                    return date;
                }
            }
            return null;
        }

        function startNewOrderFlow() {
            resetForm();
            showForm();
            document.getElementById('order-number').value = getNextOrderNumber();
            document.getElementById('form-title').textContent = "New Order";
            conversationState = 'AWAIT_CUSTOMER_NAME';
            speak("New order. Please state the customer's name.", () => recognition.start());
            highlightField('customer-name');
        }

        function addItemRow() {
            const container = document.getElementById('items-container');
            const index = itemCounter++;
            const newItem = document.createElement('div');
            newItem.className = 'item-row grid grid-cols-12 gap-2 items-center';
            newItem.innerHTML = `
                <div class="col-span-6">
                    <input type="text" id="item-name-${index}" placeholder="Item Name / Description" class="form-input">
                </div>
                <div class="col-span-4">
                    <input type="number" id="item-charges-${index}" placeholder="Charges" class="form-input item-charge-input" step="0.01" min="0">
                </div>
                <div class="col-span-2 text-right">
                    <button type="button" class="text-red-500 hover:text-red-700 remove-item-btn">&times; Remove</button>
                </div>
            `;
            container.appendChild(newItem);
            newItem.querySelector('.remove-item-btn').addEventListener('click', () => {
                newItem.remove();
                updateTotalCharges();
            });
            newItem.querySelector('.item-charge-input').addEventListener('input', updateTotalCharges);
        }

        function updateTotalCharges() {
            let total = 0;
            document.querySelectorAll('.item-charge-input').forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            document.getElementById('total-charges').textContent = `₹${total.toFixed(2)}`;
        }

        function searchOrders(query) {
            const lowerQuery = query.toLowerCase();
            return allOrders.filter(o =>
                (o.orderNumber && o.orderNumber.toLowerCase().includes(lowerQuery)) ||
                (o.customerName && o.customerName.toLowerCase().includes(lowerQuery)) ||
                (o.customerMobile && o.customerMobile.includes(lowerQuery))
            ).slice(0, 5); // Limit to 5 results for clarity
        }

        function renderSearchResults(results) {
            lastSearchResults = results;
            if (results.length === 0) {
                searchResultsContainer.innerHTML = '<p class="text-center text-gray-500">No orders found.</p>';
                return;
            }
            searchResultsContainer.innerHTML = results.map((order, index) => {
                const totalCharges = order.type === 'stitching' ? (order.items || []).reduce((s, i) => s + (i.charges || 0), 0) : (order.charges || 0);
                const balance = totalCharges - (order.receivedPayment || 0);
                return `
                    <div class="search-result-card bg-white p-4 border rounded-lg" onclick="loadOrderIntoForm(${order.id})">
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-indigo-700">${order.orderNumber}</p>
                            <p class="text-sm font-semibold">${order.customerName}</p>
                            <p class="text-sm ${balance > 0 ? 'text-red-600' : 'text-green-600'}">Balance: ₹${balance.toFixed(2)}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function loadOrderIntoForm(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) {
                showToast('Order not found.');
                return;
            }
            resetForm();
            showForm();
            searchResultsContainer.innerHTML = ''; // Clear search results

            document.getElementById('editing-order-id').value = order.id;
            document.getElementById('form-title').textContent = `Editing Order #${order.orderNumber}`;
            document.getElementById('order-number').value = order.orderNumber;
            document.getElementById('customer-name').value = order.customerName;
            document.getElementById('customer-mobile').value = order.customerMobile;
            document.getElementById('order-type').value = order.type;
            
            const itemsContainer = document.getElementById('items-container');
            if (order.type === 'stitching') {
                document.getElementById('pickup-date').value = order.items?.[0]?.pickupDate || '';
                order.items.forEach(item => {
                    addItemRow();
                    document.getElementById(`item-name-${itemCounter-1}`).value = item.item;
                    document.getElementById(`item-charges-${itemCounter-1}`).value = item.charges;
                });
            } else { // alteration
                document.getElementById('pickup-date').value = order.pickupDate || '';
                addItemRow();
                document.getElementById(`item-name-${itemCounter-1}`).value = order.description;
                document.getElementById(`item-charges-${itemCounter-1}`).value = order.charges;
            }
            updateTotalCharges();

            conversationState = 'ORDER_LOADED';
            const { receivedPayment = 0 } = order;
            const total = parseFloat(document.getElementById('total-charges').textContent.replace('₹', ''));
            const balance = total - receivedPayment;

            speak(`Loaded order for ${order.customerName}. Balance is ${balance.toFixed(0)} rupees. You can say 'edit customer name', 'receive payment', or 'clear form'.`);
        }
        
        // ... (existing processVoiceCommand function to be replaced) ...
        async function processVoiceCommand(transcript) {
            const lowerText = transcript.toLowerCase();

            // Universal commands
            if (lowerText.includes('clear') || lowerText.includes('cancel')) {
                speak("Okay, form cleared.");
                hideForm();
                return;
            }

            switch (conversationState) {
                case 'IDLE':
                    if (lowerText.includes('new order')) {
                        startNewOrderFlow();
                    } else if (lowerText.startsWith('search for') || lowerText.startsWith('find order')) {
                        const query = lowerText.replace('search for', '').replace('find order', '').trim();
                        if (query) {
                            const results = searchOrders(query);
                            renderSearchResults(results);
                            if (results.length > 0) {
                                speak(`Found ${results.length} order${results.length > 1 ? 's' : ''}.`);
                            } else {
                                speak("Sorry, I couldn't find any matching orders.");
                            }
                        } else {
                            conversationState = 'AWAIT_SEARCH_QUERY';
                            speak("What would you like to search for?");
                        }
                    } else {
                        speak("I didn't understand. Say 'New Order' or 'Search for...'");
                    }
                    break;

                case 'AWAIT_SEARCH_QUERY':
                    const results = searchOrders(lowerText);
                    renderSearchResults(results);
                    if (results.length > 0) {
                        speak(`Found ${results.length} order${results.length > 1 ? 's' : ''}.`);
                    } else {
                        speak("Sorry, I couldn't find any matching orders.");
                    }
                    conversationState = 'IDLE';
                    break;
                
                case 'ORDER_LOADED':
                    if (lowerText.startsWith('edit customer name to')) {
                        const newName = transcript.substring('edit customer name to'.length).trim();
                        document.getElementById('customer-name').value = newName;
                        speak(`Customer name changed to ${newName}.`);
                    } else if (lowerText.startsWith('change mobile number to')) {
                        const newMobile = transcript.substring('change mobile number to'.length).replace(/\s/g, '');
                        if (/^\d{10}$/.test(newMobile)) {
                            document.getElementById('customer-mobile').value = newMobile;
                            speak(`Mobile number changed.`);
                        } else {
                            speak("That doesn't seem like a valid 10-digit number.");
                        }
                    } else if (lowerText.startsWith('update pickup date to')) {
                        const dateText = lowerText.substring('update pickup date to'.length).trim();
                        const newDate = parseSpokenDate(dateText);
                        if (newDate) {
                            document.getElementById('pickup-date').valueAsDate = newDate;
                            speak(`Pickup date updated.`);
                        } else {
                            speak("I didn't understand that date.");
                        }
                    } else if (lowerText.startsWith('receive payment')) {
                        const amountText = lowerText.replace('receive payment of', '').trim();
                        const amount = parseSpokenNumber(amountText);
                        if (!isNaN(amount)) {
                            stateContext.paymentAmount = amount;
                            conversationState = 'AWAIT_PAYMENT_CONFIRMATION';
                            speak(`Receive payment of ${amount} rupees. Is that correct? Say 'yes' or 'no'.`, () => recognition.start());
                        } else {
                            conversationState = 'AWAIT_PAYMENT_AMOUNT';
                            speak("How much was received?", () => recognition.start());
                        }
                    }
                    else if(lowerText.includes('save')) {
                        conversationState = 'AWAIT_SAVE_CONFIRMATION';
                        speak("Should I save the changes? Please say 'yes' or 'no'.", () => recognition.start());
                    } else {
                        speak("You can say 'edit customer name', 'receive payment', or 'save'.");
                    }
                    break;
                
                case 'AWAIT_PAYMENT_AMOUNT':
                    const amount = parseSpokenNumber(lowerText);
                     if (!isNaN(amount)) {
                        stateContext.paymentAmount = amount;
                        conversationState = 'AWAIT_PAYMENT_CONFIRMATION';
                        speak(`Receive payment of ${amount} rupees. Is that correct? Say 'yes' or 'no'.`, () => recognition.start());
                    } else {
                        speak("Sorry, I didn't get the amount. Please repeat.", () => recognition.start());
                    }
                    break;

                case 'AWAIT_PAYMENT_CONFIRMATION':
                    if (lowerText.includes('yes')) {
                        const orderId = document.getElementById('editing-order-id').value;
                        const order = allOrders.find(o => o.id == orderId);
                        if (order && stateContext.paymentAmount) {
                            const newPayment = { id: Date.now(), amount: stateContext.paymentAmount, date: new Date().toISOString(), mode: 'Voice' };
                            const updatedPayments = [...(order.payments || []), newPayment];
                            const newReceivedPayment = updatedPayments.reduce((sum, p) => sum + (p.amount || 0), 0);
                            
                            const updates = {
                                payments: updatedPayments,
                                receivedPayment: newReceivedPayment,
                                lastUpdated: new Date().toISOString()
                            };

                            try {
                                await db.ref('orders/' + order.id).update(updates);
                                speak("Payment saved successfully.");
                                showToast("Payment saved.");
                                loadOrderIntoForm(order.id); // Reload to show updated balance
                            } catch (error) {
                                speak("Sorry, there was an error saving the payment.");
                            }
                        }
                        conversationState = 'ORDER_LOADED';
                    } else {
                        speak("Payment cancelled.");
                        conversationState = 'ORDER_LOADED';
                    }
                    break;

                // --- NEW ORDER FLOW (existing logic) ---
                case 'AWAIT_CUSTOMER_NAME':
                    document.getElementById('customer-name').value = transcript;
                    conversationState = 'AWAIT_MOBILE';
                    speak("Please state the 10-digit mobile number.", () => recognition.start());
                    highlightField('customer-mobile');
                    break;
                case 'AWAIT_MOBILE':
                    const mobile = transcript.replace(/\s/g, '');
                    if (/^\d{10}$/.test(mobile)) {
                        document.getElementById('customer-mobile').value = mobile;
                        conversationState = 'AWAIT_ORDER_TYPE';
                        speak("What is the order type? Say 'stitching' or 'alteration'.", () => recognition.start());
                        highlightField('order-type');
                    } else {
                        speak("The mobile number is incorrect. Please say the 10-digit number again.", () => recognition.start());
                    }
                    break;
                case 'AWAIT_ORDER_TYPE':
                    // ... (same as before) ...
                    const isStitching = ['stitching', 'silai', 'सिलाई', 'stitch', 'st', '1', 'one', 'एक'].some(keyword => lowerText.includes(keyword));
                    const isAlteration = ['alteration', 'alter', 'अल्टरेशन', 'at', '2', 'two', 'दो', 'do', 'to', 'too'].some(keyword => lowerText.includes(keyword));

                    if (isStitching) {
                        document.getElementById('order-type').value = 'stitching';
                        conversationState = 'AWAIT_ITEM_COUNT';
                        speak("How many suits are there?", () => recognition.start());
                        highlightField(null); // No specific field to highlight
                    } else if (isAlteration) {
                        document.getElementById('order-type').value = 'alteration';
                        conversationState = 'AWAIT_ITEM_COUNT';
                        speak("How many items are there?", () => recognition.start());
                        highlightField(null);
                    } else {
                        speak("I didn't understand. Please say 'stitching' or 'alteration'.", () => recognition.start());
                    }
                    break;
                case 'AWAIT_ITEM_COUNT':
                     const itemCount = parseSpokenNumber(lowerText);
                    if (itemCount > 0 && itemCount <= 10) {
                        totalItemsToAdd = itemCount;
                        currentItemIndex = 0;
                        document.getElementById('items-container').innerHTML = ''; // Clear previous items
                        for (let i = 0; i < totalItemsToAdd; i++) {
                            addItemRow();
                        }
                        conversationState = 'AWAIT_ITEM_NAME';
                        const itemNamePrompt = totalItemsToAdd > 1 ? "Please state the name of the first item." : "Please state the item's description.";
                        speak(itemNamePrompt, () => recognition.start());
                        highlightField(`item-name-${currentItemIndex}`);
                    } else {
                        speak("Please state a number between 1 and 10.", () => recognition.start());
                    }
                    break;
                case 'AWAIT_ITEM_NAME':
                    document.getElementById(`item-name-${currentItemIndex}`).value = transcript;
                    conversationState = 'AWAIT_ITEM_CHARGES';
                    speak("What are the charges for this item?", () => recognition.start());
                    highlightField(`item-charges-${currentItemIndex}`);
                    break;
                case 'AWAIT_ITEM_CHARGES':
                    const charges = parseSpokenNumber(lowerText);
                    if (!isNaN(charges)) {
                        document.getElementById(`item-charges-${currentItemIndex}`).value = charges;
                        updateTotalCharges();
                        currentItemIndex++;

                        if (currentItemIndex < totalItemsToAdd) {
                            conversationState = 'AWAIT_ITEM_NAME';
                            speak(`Please state the name for item ${currentItemIndex + 1}.`, () => recognition.start());
                            highlightField(`item-name-${currentItemIndex}`);
                        } else {
                            conversationState = 'AWAIT_PICKUP_DATE';
                            speak("What is the pickup date?", () => recognition.start());
                            highlightField('pickup-date');
                        }
                    } else {
                        speak("I didn't understand the charges. Please say the amount again.", () => recognition.start());
                    }
                    break;
                case 'AWAIT_PICKUP_DATE':
                    const parsedDate = parseSpokenDate(transcript);
                    if (parsedDate) {
                        document.getElementById('pickup-date').valueAsDate = parsedDate;
                        conversationState = 'AWAIT_SAVE_CONFIRMATION';
                        speak("Should I save this order? Please say 'yes' or 'no'.", () => recognition.start());
                        highlightField(null);
                    } else {
                        speak("I didn't understand the date. Please say 'today', 'tomorrow', or the date.", () => recognition.start());
                    }
                    break;
                case 'AWAIT_SAVE_CONFIRMATION':
                    if (lowerText.includes('yes') || lowerText.includes('save') || lowerText.includes('हाँ') || lowerText.includes('han')) {
                        orderForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                    } else if (lowerText.includes('no') || lowerText.includes('cancel') || lowerText.includes('ना')) {
                        speak("Okay, the order has been cancelled.");
                        hideForm();
                    } else {
                        speak("I didn't understand. Please say 'yes' or 'no'.", () => recognition.start());
                    }
                    break;
            }
        }
        
        // ... (existing form submit logic is fine, it already handles new vs edit) ...
        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!db) {
                showToast("Database not connected. Cannot save order.", 4000);
                return;
            }

            const editingOrderId = document.getElementById('editing-order-id').value;
            const customerName = document.getElementById('customer-name').value.trim();
            const customerMobile = document.getElementById('customer-mobile').value.trim();
            const orderType = document.getElementById('order-type').value;
            const pickupDate = document.getElementById('pickup-date').value;

            if (!customerName || !customerMobile) {
                const msg = "Customer name and mobile are required.";
                speak(msg);
                showToast(msg);
                return;
            }

            const itemRows = document.querySelectorAll('#items-container .item-row');
            if (itemRows.length === 0) {
                const msg = "Please add at least one item.";
                speak(msg);
                showToast(msg);
                return;
            }

            const newId = editingOrderId ? parseInt(editingOrderId) : Date.now();
            const existingOrder = editingOrderId ? allOrders.find(o => o.id == editingOrderId) : null;

            const orderData = {
                id: newId,
                orderNumber: document.getElementById('order-number').value,
                customerName,
                customerMobile,
                type: orderType,
                bookingDate: existingOrder?.bookingDate || new Date().toISOString(),
                lastUpdated: new Date().toISOString(),
                paymentReceived: existingOrder?.paymentReceived || false,
                pipelineStatus: existingOrder?.pipelineStatus || 'new',
                payments: existingOrder?.payments || [],
                receivedPayment: existingOrder?.receivedPayment || 0
            };

            if (orderType === 'stitching') {
                orderData.items = Array.from(itemRows).map((row, i) => ({
                    item: row.querySelector(`input[id^="item-name-"]`).value.trim(),
                    charges: parseFloat(row.querySelector(`input[id^="item-charges-"]`).value) || 0,
                    pickupDate: pickupDate
                })).filter(item => item.item);
                
                if (orderData.items.length === 0) {
                    showToast("Please provide item names for stitching order.");
                    return;
                }
            } else { // alteration
                const description = Array.from(itemRows).map(row => row.querySelector(`input[id^="item-name-"]`).value.trim()).filter(Boolean);
                const totalCharges = Array.from(itemRows).reduce((sum, row) => sum + (parseFloat(row.querySelector(`input[id^="item-charges-"]`).value) || 0), 0);
                
                if (description.length === 0) {
                    showToast("Please provide alteration details.");
                    return;
                }
                orderData.description = description.join(', ');
                orderData.charges = totalCharges;
                orderData.pickupDate = pickupDate;
            }
            
            const totalChargesValue = orderData.charges ?? (orderData.items ? orderData.items.reduce((s,i)=>s + (i.charges || 0), 0) : 0);
            orderData.paymentReceived = (orderData.receivedPayment || 0) >= totalChargesValue;

            try {
                await db.ref('orders/' + newId).set(orderData);
                
                const successMessage = editingOrderId ? "Order updated successfully." : "Order saved successfully.";
                speak(successMessage);
                showToast(editingOrderId ? "Order updated." : "Order saved.");
                hideForm();
                resetForm();
            } catch (error) {
                console.error("Error saving order:", error);
                speak("There was an error saving the order.");
                showToast("Error saving order. See console for details.", 5000);
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            initializeFirebase();
            setupVoiceRecognition();
            
            clearFormBtn.addEventListener('click', () => {
                showToast('Form cleared.');
                hideForm();
            });
            addItemBtn.addEventListener('click', addItemRow);

            let searchDebounce;
            globalSearchInput.addEventListener('input', () => {
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(() => {
                    const query = globalSearchInput.value.trim();
                    if(query) {
                        renderSearchResults(searchOrders(query));
                    } else {
                        searchResultsContainer.innerHTML = '';
                    }
                }, 300);
            });
        });

        // Make functions globally accessible for onclick handlers
        window.loadOrderIntoForm = loadOrderIntoForm;
    </script>
